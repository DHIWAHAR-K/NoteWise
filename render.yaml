# Render Blueprint: FastAPI (Docker) + PostgreSQL + MongoDB as Private Services with disks.
# Private services are not on the free instance type; use Starter or higher for DB pservs.
# Set POSTGRES_PASSWORD, MONGO_ROOT_PASSWORD, CORS_ORIGINS, API keys, JWT_SECRET, and MOONSHOT_* in the Dashboard (sync: false).
# Mark 3 smoke (after deploy): GET /health, /health/db, /health/mongo → POST /auth/register → POST /auth/login →
# GET /auth/me (Bearer) → GET /chat/conversations → POST /scribe/sessions → POST /imaging/classify (with MOONSHOT_API_KEY).

services:
  - type: pserv
    name: notewise-postgres
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/library/postgres:16
    envVars:
      - key: POSTGRES_USER
        value: notewise
      - key: POSTGRES_DB
        value: notewise
      - key: POSTGRES_PASSWORD
        sync: false
    disk:
      name: pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 10

  - type: pserv
    name: notewise-mongo
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/library/mongo:7.0
    envVars:
      - key: MONGO_INITDB_ROOT_USERNAME
        value: notewise
      - key: MONGO_INITDB_ROOT_PASSWORD
        sync: false
    disk:
      name: mongodata
      mountPath: /data/db
      sizeGB: 10

  - type: web
    name: notewise-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    # Runs in the built image before the new release receives traffic (DATABASE_URL / POSTGRES_* must be set).
    preDeployCommand: python -m alembic upgrade head
    envVars:
      - key: PORT
        value: "8000"
      - key: POSTGRES_HOST
        fromService:
          name: notewise-postgres
          type: pserv
          property: host
      - key: POSTGRES_PORT
        fromService:
          name: notewise-postgres
          type: pserv
          property: port
      - key: POSTGRES_USER
        value: notewise
      - key: POSTGRES_DB
        value: notewise
      - key: POSTGRES_PASSWORD
        sync: false
      - key: MONGODB_HOST
        fromService:
          name: notewise-mongo
          type: pserv
          property: host
      - key: MONGODB_PORT
        fromService:
          name: notewise-mongo
          type: pserv
          property: port
      - key: MONGO_ROOT_USER
        value: notewise
      - key: MONGO_ROOT_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: notewise-kb
      - key: PINECONE_ENVIRONMENT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: MOONSHOT_API_KEY
        sync: false
      - key: MOONSHOT_BASE_URL
        value: https://api.moonshot.ai/v1
      - key: MOONSHOT_VISION_MODEL
        value: moonshot-v1-8k-vision-preview
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
